app = 'wdalmardy-db'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "mysqldata"
  destination = "/var/lib/mysql"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
