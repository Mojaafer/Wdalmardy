# fly.toml for wdalmardy-app (combined MariaDB + Laravel)
app = "wdalmardy-app"
primary_region = "ams"

[build]
  dockerfile = "fly/combined/Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "mysqldata"
  destination = "/var/lib/mysql"

[env]
  APP_URL = "https://wdalmardy-app.fly.dev"
  FRONTEND_URL = "https://frontend-cyan-eta-39.vercel.app"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
